name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # `npm ci` is used deliberately: package-lock.json pins the official npm registry and
      # integrity hashes, so CI installs exactly the locked dependency tree.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # lib/ is build output committed to the repository (users can run it without TypeScript),
      # so it must stay in sync with src/ — forgetting to build after changing src is caught here.
      - name: Check lib/ is in sync with src/
        run: git diff --exit-code -- lib

      # The tests ship with a mock ComfyUI, so running them needs no real ComfyUI installation.
      - name: Unit tests + end-to-end tests
        run: npm test

      - name: Self-check failure path (must exit with code 1 when unreachable)
        shell: bash
        run: |
          set +e
          node scripts/doctor.mjs --base-url http://127.0.0.1:1 > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" != "1" ]; then
            echo "doctor should exit with code 1 when it cannot reach ComfyUI; got $code"
            exit 1
          fi
